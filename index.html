<!doctype html>
<html lang="de">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,viewport-fit=cover"
        />
        <meta name="theme-color" content="#101411" />
        <title>QR Song Quiz</title>
        <script src="https://unpkg.com/html5-qrcode" defer></script>
        <style>
            :root {
                --bg: #101411;
                --panel: #1b231d;
                --green: #1ed760;
                --muted: #aab7ac;
                --line: #344239;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                background: linear-gradient(145deg, #0b100d, #18221a);
                color: #f4f7f4;
                font-family:
                    system-ui,
                    -apple-system,
                    Segoe UI,
                    sans-serif;
                min-height: 100vh;
            }
            main {
                max-width: 720px;
                margin: auto;
                padding: 22px 15px 44px;
            }
            .brand {
                color: var(--green);
                font-weight: 850;
                letter-spacing: 0.08em;
                font-size: 0.85rem;
            }
            h1 {
                font-size: clamp(2.3rem, 10vw, 4rem);
                line-height: 0.98;
                margin: 20px 0 10px;
                letter-spacing: -0.04em;
            }
            h2 {
                font-size: 1.15rem;
                margin: 0 0 14px;
            }
            p {
                color: var(--muted);
                line-height: 1.5;
            }
            .panel {
                background: rgba(27, 35, 29, 0.97);
                border: 1px solid var(--line);
                border-radius: 22px;
                padding: 18px;
                margin: 15px 0;
            }
            button,
            .btn {
                border: 0;
                border-radius: 999px;
                padding: 12px 16px;
                font-weight: 800;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                text-decoration: none;
                font: inherit;
                font-weight: 750;
            }
            .primary {
                background: var(--green);
                color: #071009;
            }
            .secondary {
                background: #303c33;
                color: white;
                border: 1px solid #4a5a4d;
            }
            button:disabled {
                opacity: 0.45;
                cursor: not-allowed;
            }
            .actions {
                display: flex;
                gap: 9px;
                flex-wrap: wrap;
                margin-top: 12px;
            }
            .status {
                background: #101811;
                border: 1px solid #28372b;
                padding: 12px;
                border-radius: 12px;
                margin-top: 12px;
                color: #dce9de;
                font-size: 0.92rem;
                overflow-wrap: anywhere;
            }
            #reader {
                width: 100%;
                overflow: hidden;
                border-radius: 15px;
            }
            #reader video {
                border-radius: 15px;
            }
            label {
                font-size: 0.88rem;
                color: #dce5dd;
                display: block;
                margin: 9px 0 4px;
            }
            input {
                width: 100%;
                background: #0e1510;
                color: white;
                border: 1px solid var(--line);
                border-radius: 12px;
                padding: 12px;
                font: inherit;
                margin-bottom: 5px;
            }
            .song {
                display: flex;
                gap: 13px;
                align-items: center;
                margin: 12px 0;
            }
            .disc {
                width: 56px;
                height: 56px;
                border-radius: 50%;
                flex: none;
                background: radial-gradient(
                    circle,
                    #0c120e 0 12%,
                    var(--green) 13% 18%,
                    #213b2a 19% 100%
                );
                display: grid;
                place-items: center;
                font-size: 1.2rem;
            }
            .song strong {
                display: block;
                font-size: 1.12rem;
            }
            .song small {
                display: block;
                color: var(--muted);
                margin-top: 3px;
            }
            .small {
                font-size: 0.83rem;
            }
            .pill {
                display: inline-block;
                padding: 4px 9px;
                border-radius: 999px;
                background: #29362c;
                color: #ccebd3;
                font-size: 0.75rem;
                font-weight: 750;
            }
            .progress {
                height: 5px;
                border-radius: 99px;
                background: #344239;
                overflow: hidden;
                margin: 12px 0;
            }
            .progress span {
                display: block;
                height: 100%;
                width: 0;
                background: var(--green);
            }
            footer {
                display: none;
            }
            .auth-only {
                max-width: 520px;
                margin: 12vh auto 0;
                text-align: center;
            }
            .auth-only h1 {
                font-size: clamp(2.2rem, 9vw, 3.5rem);
            }
            .auth-only .primary {
                width: 100%;
                padding: 16px;
            }
            .app-content[hidden],
            .auth-only[hidden] {
                display: none !important;
            }
            .song-card {
                text-align: center;
                padding: 24px 18px;
            }
            .song-card .disc {
                width: 112px;
                height: 112px;
                margin: 10px auto 18px;
                font-size: 2rem;
            }
            .song-card h2 {
                font-size: 1.35rem;
            }
            .scan-heading {
                font-size: 1.35rem;
            }
            .duration-buttons {
                display: flex;
                gap: 8px;
                justify-content: center;
                flex-wrap: wrap;
                margin: 14px 0;
            }
            .duration-buttons button {
                min-width: 60px;
            }
            .duration-buttons button.selected {
                outline: 2px solid var(--green);
                background: #203b29;
                color: #fff;
            }
            .reveal {
                margin-top: 10px;
                width: 100%;
            }
        </style>
    </head>
    <body>
        <main>
            <div class="brand">● QR SONG QUIZ</div>
            <section class="panel auth-only" id="authGate">
                <div
                    class="disc"
                    style="
                        margin: 0 auto 22px;
                        width: 78px;
                        height: 78px;
                        font-size: 1.7rem;
                    "
                >
                    ♫
                </div>
                <h1>Mit Spotify verbinden</h1>
                <p>Verbinde Spotify, um die Songs des Quiz abzuspielen.</p>
                <button class="primary" id="login">
                    Mit Spotify verbinden
                </button>
                <p class="small" id="authStatus" role="status"></p>
            </section>
            <div id="appContent" class="app-content" hidden>
                <section class="panel song-card">
                    <div class="disc">♫</div>
                    <h2 id="trackTitle">Bereit für den Song</h2>
                    <p id="trackSub">
                        Der Songtitel und Interpret werden hier nicht angezeigt.
                    </p>
                    <div
                        class="duration-buttons"
                        aria-label="Songdauer auswählen"
                    >
                        <button class="secondary selected" data-duration="1">
                            1 s</button
                        ><button class="secondary" data-duration="2">2 s</button
                        ><button class="secondary" data-duration="4">4 s</button
                        ><button class="secondary" data-duration="10">
                            10 s
                        </button>
                    </div>
                    <div class="progress"><span id="progressBar"></span></div>
                    <div class="actions" style="justify-content: center">
                        <button class="primary" id="play" disabled>
                            ▶ Song starten
                        </button>
                    </div>
                    <button class="secondary reveal" id="reveal" hidden>
                        Songnamen verraten
                    </button>
                </section>
                <section class="panel">
                    <h2 class="scan-heading">Scanne den nächsten Song</h2>
                    <div id="reader"></div>
                    <div class="actions">
                        <button class="primary" id="start">
                            ▦ Kamera starten
                        </button>
                    </div>
                    <div class="status" id="status" role="status"></div>
                </section>
            </div>
            <section hidden>
                <input id="clientId" /><input id="redirectUri" /><button
                    id="saveConfig"
                ></button
                ><button id="manualToggle"></button>
                <div id="manualArea" hidden>
                    <input id="trackInput" /><button id="loadTrack"></button>
                </div>
                <button id="openSpotify"></button><span id="loginLabel"></span
                ><span id="profile"></span>
            </section>
        </main>
        <script>
            const $ = (id) => document.getElementById(id),
                CFG = "qr-song-quiz-config",
                TOK = "qr-song-quiz-token";
            let config = {
                clientId: "144d7bf257df408c8812f246087b0d5b",
                redirectUri: "https://janine.zaenger.lu/",
            };
            try {
                config = {
                    ...config,
                    ...JSON.parse(localStorage.getItem(CFG) || "{}"),
                };
            } catch (e) {}
            if (!config.clientId)
                config.clientId = "144d7bf257df408c8812f246087b0d5b";
            if (!config.redirectUri)
                config.redirectUri = "https://janine.zaenger.lu/";
            localStorage.setItem(CFG, JSON.stringify(config));
            let accessToken = "",
                player = null,
                deviceId = "",
                currentTrack = "",
                scanner = null,
                running = false,
                selectedDuration = 1,
                stopTimer = null;
            function status(t) {
                $("status").textContent = t;
            }
            function rand(n = 64) {
                const chars =
                        "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~",
                    a = crypto.getRandomValues(new Uint8Array(n));
                return Array.from(a, (b) => chars[b % chars.length]).join("");
            }
            function b64url(buf) {
                return btoa(String.fromCharCode(...new Uint8Array(buf)))
                    .replace(/\+/g, "-")
                    .replace(/\//g, "_")
                    .replace(/=+$/, "");
            }
            async function digest(s) {
                return b64url(
                    await crypto.subtle.digest(
                        "SHA-256",
                        new TextEncoder().encode(s),
                    ),
                );
            }
            function parseTrack(v) {
                v = String(v || "").trim();
                let m =
                    v.match(/spotify:track:([A-Za-z0-9]+)/i) ||
                    v.match(
                        /open\.spotify\.com\/(?:intl-[a-z]{2}\/)?track\/([A-Za-z0-9]+)/i,
                    );
                if (m) return m[1];
                if (/^[A-Za-z0-9]{22}$/.test(v)) return v;
                try {
                    let u = new URL(v);
                    return parseTrack(
                        u.searchParams.get("track") || u.searchParams.get("id"),
                    );
                } catch (e) {}
                return null;
            }
            function setLoginUI() {
                let yes = !!accessToken;
                $("authGate").hidden = yes;
                $("appContent").hidden = !yes;
                if (!yes) {
                    $("authStatus").textContent = "";
                }
            }
            async function login() {
                if (!config.clientId) {
                    $("authStatus").textContent = "Spotify Client ID fehlt.";
                    return;
                }
                localStorage.setItem(CFG, JSON.stringify(config));
                let verifier = rand(),
                    state = rand(24),
                    challenge = await digest(verifier);
                sessionStorage.setItem("pkce_verifier", verifier);
                sessionStorage.setItem("oauth_state", state);
                sessionStorage.setItem("pending_track", currentTrack);
                let u = new URL("https://accounts.spotify.com/authorize");
                u.search = new URLSearchParams({
                    client_id: config.clientId,
                    response_type: "code",
                    redirect_uri: config.redirectUri,
                    code_challenge_method: "S256",
                    code_challenge: challenge,
                    state,
                    scope: "streaming user-read-email user-read-private user-modify-playback-state",
                }).toString();
                location.href = u.href;
            }
            async function callback() {
                let q = new URLSearchParams(location.search),
                    code = q.get("code");
                if (q.get("error")) {
                    status("Spotify-Anmeldung abgebrochen.");
                    history.replaceState({}, "", location.pathname);
                    return;
                }
                if (!code) return;
                if (q.get("state") !== sessionStorage.getItem("oauth_state")) {
                    status("OAuth-Sicherheitsprüfung fehlgeschlagen.");
                    return;
                }
                try {
                    let r = await fetch(
                            "https://accounts.spotify.com/api/token",
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type":
                                        "application/x-www-form-urlencoded",
                                },
                                body: new URLSearchParams({
                                    client_id: config.clientId,
                                    grant_type: "authorization_code",
                                    code,
                                    redirect_uri: config.redirectUri,
                                    code_verifier:
                                        sessionStorage.getItem("pkce_verifier"),
                                }),
                            },
                        ),
                        d = await r.json();
                    if (!r.ok) throw Error(d.error_description || d.error);
                    d.expires_at = Date.now() + d.expires_in * 1000;
                    localStorage.setItem(TOK, JSON.stringify(d));
                    accessToken = d.access_token;
                    history.replaceState({}, "", location.pathname);
                    let pending = sessionStorage.getItem("pending_track");
                    sessionStorage.removeItem("pending_track");
                    setLoginUI();
                    await setupPlayer();
                    if (pending) await loadTrack(pending);
                    else status("Spotify verbunden.");
                } catch (e) {
                    status("Spotify-Login fehlgeschlagen: " + e.message);
                }
            }
            async function refresh() {
                try {
                    let d = JSON.parse(localStorage.getItem(TOK) || "{}");
                    if (d.access_token && d.expires_at > Date.now() + 15000) {
                        accessToken = d.access_token;
                        return accessToken;
                    }
                    if (d.refresh_token) {
                        let r = await fetch(
                                "https://accounts.spotify.com/api/token",
                                {
                                    method: "POST",
                                    headers: {
                                        "Content-Type":
                                            "application/x-www-form-urlencoded",
                                    },
                                    body: new URLSearchParams({
                                        client_id: config.clientId,
                                        grant_type: "refresh_token",
                                        refresh_token: d.refresh_token,
                                    }),
                                },
                            ),
                            n = await r.json();
                        if (r.ok) {
                            d = {
                                ...d,
                                ...n,
                                expires_at: Date.now() + n.expires_in * 1000,
                            };
                            localStorage.setItem(TOK, JSON.stringify(d));
                            accessToken = d.access_token;
                            return accessToken;
                        }
                    }
                } catch (e) {}
                accessToken = "";
                return "";
            }
            function sdk() {
                return new Promise((resolve, reject) => {
                    if (window.Spotify) return resolve();
                    window.onSpotifyWebPlaybackSDKReady = resolve;
                    let s = document.createElement("script");
                    s.src = "https://sdk.scdn.co/spotify-player.js";
                    s.onerror = reject;
                    document.head.append(s);
                });
            }
            async function setupPlayer() {
                if (!accessToken || player) return;
                try {
                    await sdk();
                    player = new Spotify.Player({
                        name: "QR Song Quiz",
                        getOAuthToken: (cb) => cb(accessToken),
                        volume: 0.8,
                    });
                    player.addListener("ready", (x) => {
                        deviceId = x.device_id;
                        status(
                            "Spotify-Player bereit. Tippe auf Song starten.",
                        );
                    });
                    player.addListener("account_error", () =>
                        status(
                            "Spotify Premium wird für den Web Player benötigt.",
                        ),
                    );
                    player.addListener("authentication_error", () =>
                        status(
                            "Spotify-Login abgelaufen. Bitte erneut anmelden.",
                        ),
                    );
                    player.addListener("playback_error", (e) =>
                        status("Wiedergabefehler: " + e.message),
                    );
                    await player.connect();
                } catch (e) {
                    status(
                        "Spotify Player konnte nicht gestartet werden. Prüfe Browser und Verbindung.",
                    );
                }
            }
            async function loadTrack(raw) {
                let id = parseTrack(raw);
                if (!id) {
                    if (accessToken) status("Ungültiger QR-Code.");
                    return;
                }
                currentTrack = id;
                $("trackTitle").textContent = "Song bereit";
                $("trackSub").textContent = "";
                $("reveal").hidden = false;
                $("reveal").textContent = "Songnamen verraten";
                $("play").disabled = false;
                $("progressBar").style.width = "0%";
                if (accessToken) status("Song bereit.");
            }
            async function playTrack() {
                if (!currentTrack) {
                    status("Scanne zuerst einen Song.");
                    return;
                }
                accessToken = await refresh();
                if (!accessToken) {
                    sessionStorage.setItem("pending_track", currentTrack);
                    await login();
                    return;
                }
                if (!player || !deviceId) {
                    await setupPlayer();
                    status(
                        "Player wird gestartet. Tippe erneut auf „Song starten“, falls nötig.",
                    );
                    return;
                }
                try {
                    await fetch("https://api.spotify.com/v1/me/player", {
                        method: "PUT",
                        headers: {
                            Authorization: "Bearer " + accessToken,
                            "Content-Type": "application/json",
                        },
                        body: JSON.stringify({
                            device_ids: [deviceId],
                            play: true,
                        }),
                    });
                    let r = await fetch(
                        "https://api.spotify.com/v1/me/player/play?device_id=" +
                            deviceId,
                        {
                            method: "PUT",
                            headers: {
                                Authorization: "Bearer " + accessToken,
                                "Content-Type": "application/json",
                            },
                            body: JSON.stringify({
                                uris: ["spotify:track:" + currentTrack],
                                position_ms: 0,
                            }),
                        },
                    );
                    if (!r.ok)
                        throw Error(
                            "Spotify konnte nicht starten. Prüfe Premium und aktives Gerät.",
                        );
                    status("Song läuft.");
                    if (stopTimer) clearTimeout(stopTimer);
                    let start = performance.now(),
                        durationMs = selectedDuration * 1000;
                    const tick = () => {
                        let ms = performance.now() - start;
                        $("progressBar").style.width =
                            Math.min(100, (ms / durationMs) * 100) + "%";
                        if (ms >= durationMs) {
                            player.pause();
                            $("progressBar").style.width = "100%";
                            status("Song pausiert.");
                        } else requestAnimationFrame(tick);
                    };
                    requestAnimationFrame(tick);
                    stopTimer = setTimeout(() => {
                        if (player) player.pause();
                        $("progressBar").style.width = "100%";
                        status("Song pausiert.");
                    }, durationMs);
                } catch (e) {
                    status(e.message);
                }
            }
            async function startScan() {
                if (running) return;
                if (!window.Html5Qrcode) {
                    status("Scanner lädt noch.");
                    return;
                }
                try {
                    scanner = new Html5Qrcode("reader");
                    await scanner.start(
                        { facingMode: "environment" },
                        { fps: 10, qrbox: { width: 230, height: 230 } },
                        (txt) => {
                            let id = parseTrack(txt);
                            if (id && id !== currentTrack) loadTrack(txt);
                            else if (!id) status("Ungültiger QR-Code.");
                        },
                        () => {},
                    );
                    running = true;
                    status("Kamera aktiv. Scanne den nächsten QR-Code.");
                } catch (e) {
                    status(
                        "Kamera nicht verfügbar. Erlaube den Zugriff und nutze HTTPS.",
                    );
                }
            }
            $("login").onclick = login;
            $("start").onclick = startScan;
            document.querySelectorAll("[data-duration]").forEach(
                (btn) =>
                    (btn.onclick = () => {
                        selectedDuration = Number(btn.dataset.duration);
                        document
                            .querySelectorAll("[data-duration]")
                            .forEach((b) =>
                                b.classList.toggle("selected", b === btn),
                            );
                    }),
            );
            $("reveal").onclick = async () => {
                if (!currentTrack) return;
                try {
                    accessToken = await refresh();
                    let r = await fetch(
                        "https://api.spotify.com/v1/tracks/" + currentTrack,
                        { headers: { Authorization: "Bearer " + accessToken } },
                    );
                    if (!r.ok) throw Error();
                    let d = await r.json();
                    $("trackTitle").textContent = d.name;
                    $("trackSub").textContent = d.artists
                        .map((a) => a.name)
                        .join(", ");
                    $("reveal").hidden = true;
                } catch (e) {
                    status("Songinformationen konnten nicht geladen werden.");
                }
            };
            $("manualToggle").onclick = () => {
                $("manualArea").hidden = !$("manualArea").hidden;
            };
            $("loadTrack").onclick = () => loadTrack($("trackInput").value);
            $("play").onclick = playTrack;

            $("saveConfig").onclick = () => {
                localStorage.setItem(CFG, JSON.stringify(config));
            };
            $("clientId").value = config.clientId;
            $("redirectUri").value = config.redirectUri;
            (async () => {
                await callback();
                accessToken = await refresh();
                setLoginUI();
                let q = new URLSearchParams(location.search),
                    track = q.get("track") || q.get("id");
                if (track) {
                    currentTrack = parseTrack(track) || "";
                    if (accessToken && currentTrack)
                        await loadTrack(currentTrack);
                    else if (currentTrack)
                        sessionStorage.setItem("pending_track", currentTrack);
                }
                if (accessToken) {
                    setupPlayer();
                    if (!running) startScan();
                }
            })();
        </script>
    </body>
</html>
